name: cashewguard_ai
description: A mobile-based cashew leaf disease detection app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  google_fonts: ^8.2.1
  image_picker: ^1.0.4
  cached_network_image: ^3.3.0
  percent_indicator: ^4.2.3
  smooth_page_indicator: ^2.0.1
  camera: ^0.12.0+1
  http: ^1.2.1
  tflite_flutter: ^0.12.1
  image: ^4.1.3
  permission_handler: ^13.0.0
  provider: ^6.1.2
  supabase_flutter: ^2.3.4   # ✅ FIXED: moved from dev_dependencies to dependencies
  pdf: ^3.11.1
  printing: ^5.13.1
  path_provider: ^2.1.2
  flutter_cache_manager: ^3.3.2
  shared_preferences: ^2.2.3   # ✅ NEW: persists chosen language across app restarts
  geolocator: ^14.0.3
  flutter_local_notifications: ^22.2.0
  flutter_tts: ^4.2.0
  timezone: ^0.11.1
  fl_chart: ^1.2.0
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  connectivity_plus: ^7.3.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true   # ✅ NEW: required for `flutter gen-l10n` to auto-run and produce AppLocalizations
  assets:
    - assets/model/cashew_model_final.tflite   # disease detection model
    - assets/model/leaf_validator.tflite        # binary leaf validator
    - assets/images/cashewguard_logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/cashewguard_logo.png"
  adaptive_icon_background: "#0D631B"
  adaptive_icon_foreground: "assets/images/cashewguard_logo.png"
  remove_alpha_ios: true